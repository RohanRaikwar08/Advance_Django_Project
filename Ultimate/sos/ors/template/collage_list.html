<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
{% include 'header.html' %}
<form method="POST">
    {% csrf_token %}
    <div align="center">
        <h1>Collage List</h1>
    </div>
    <div align="center">
        <table>
            <tr>
                <th>Collage Name:</th>
                <td><input type="text" name="name" placeholder="enter collage name here"></td>
                <td><input type="submit" name="operation" value="search"></td>
            </tr>
        </table>
    </div>
    <br>
    <table border="1%" width="100%">
        <tr>
            <th>S. No.</th>
            <th>Collage Name</th>
            <th>Address</th>
            <th>State</th>
            <th>City</th>
            <th>PhoneNumber</th>
            <th>Action</th>
        </tr>
        {% for l in form.list %}
        <tr>
            <td align="center">{{ form.index|add:forloop.counter }}</td>
            <td align="center">{{ l.name }}</td>
            <td align="center">{{ l.address }}</td>
            <td align="center">{{ l.state }}</td>
            <td align="center">{{ l.city }}</td>
            <td align="center">{{ l.phone_number }}</td>
            <td align="center"><a href="/ors/Collage/edit/{{l.id}}/">edit</a> | <a href="/ors/CollageList/delete/{{l.id}}/">delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <table style="width: 100%">
        <tr>
            <td style="width: 25%">
                <input type="submit" name="operation" value="previous" {% if not form.has_previous %} disabled {% endif %}>
            </td>
            <td style="width: 75%"></td>
            <td>
                <input type="submit" name="operation" value="next" {% if not form.has_next %} disabled {% endif %}>
            </td>
        </tr>
    </table>
    <input type="hidden" name="pageNo" value="{{form.page_no}}">
</form>
</body>
</html>
